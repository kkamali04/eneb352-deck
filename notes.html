<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Speaker Notes — ENEB352</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --base: #1A0E1F;
  --panel: #2D1B33;
  --coral: #FF7A66;
  --peach: #FFC9A0;
  --amber: #E8A04E;
  --ink: #FCEEE6;
  --mute: #9B8090;
  --dim: #4A3350;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: var(--base);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  height: 100vh;
  overflow: hidden;
}
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}
.header {
  background: var(--panel);
  border-bottom: 1px solid rgba(255,201,160,0.1);
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.slide-info {
  font-size: 14px;
  font-weight: 600;
  color: var(--coral);
}
.timer {
  font-family: 'SF Mono', monospace;
  font-size: 18px;
  color: var(--amber);
  font-weight: 700;
}
.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  -webkit-overflow-scrolling: touch;
}
.slide-title {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 20px;
  color: var(--ink);
}
.section {
  margin-bottom: 24px;
}
.section-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--amber);
  margin-bottom: 10px;
  font-weight: 600;
}
.talking-points {
  list-style: none;
}
.talking-points li {
  padding: 12px 0 12px 28px;
  position: relative;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  font-size: 16px;
  line-height: 1.5;
  color: var(--ink);
}
.talking-points li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 18px;
  width: 8px;
  height: 8px;
  background: var(--coral);
  border-radius: 50%;
}
.script-text {
  font-size: 15px;
  line-height: 1.6;
  color: var(--mute);
  font-style: italic;
}
.nav-bar {
  background: var(--panel);
  border-top: 1px solid rgba(255,201,160,0.1);
  padding: 12px 16px;
  display: flex;
  gap: 12px;
  flex-shrink: 0;
}
.nav-btn {
  flex: 1;
  padding: 16px;
  background: var(--dim);
  border: none;
  border-radius: 10px;
  color: var(--ink);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.nav-btn:active {
  background: var(--coral);
}
.qa-btn {
  display: none;
}
.qa-modal {
  position: fixed;
  inset: 0;
  background: rgba(26,14,31,0.88);
  backdrop-filter: blur(12px);
  z-index: 20;
  display: none;
  align-items: flex-end;
}
.qa-modal.open { display: flex; }
.qa-sheet {
  width: 100%;
  max-height: 86vh;
  background: var(--panel);
  border-top-left-radius: 24px;
  border-top-right-radius: 24px;
  border-top: 1px solid rgba(255,201,160,0.12);
  padding: 20px;
  overflow-y: auto;
}
.qa-sheet h2 {
  font-size: 22px;
  margin-bottom: 14px;
}
.qa-close {
  position: sticky;
  top: 0;
  margin-left: auto;
  margin-bottom: 12px;
  display: inline-flex;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255,201,160,0.16);
  background: rgba(255,255,255,0.04);
  color: var(--ink);
  font-weight: 600;
}
.qa-group {
  margin-bottom: 18px;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.qa-group:last-child { border-bottom: none; }
.qa-q {
  color: var(--peach);
  font-weight: 700;
  margin-bottom: 6px;
}
.qa-a {
  color: var(--ink);
  line-height: 1.55;
}
@media (max-width: 820px) {
  .qa-btn { display: block; }
}
.progress-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 8px;
  flex-shrink: 0;
}
.progress-dots .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--dim);
}
.progress-dots .dot.active {
  background: var(--coral);
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="slide-info" id="slide-info">Slide 1 / 18</div>
    <div class="timer" id="timer">00:00</div>
  </div>
  
  <div class="content" id="content">
    <!-- Injected by JS -->
  </div>
  
  <div class="progress-dots" id="progress-dots"></div>
  
  <div class="nav-bar">
    <button class="nav-btn" id="prev-btn">← Prev</button>
    <button class="nav-btn qa-btn" id="qa-btn">Q&A</button>
    <button class="nav-btn" id="next-btn">Next →</button>
  </div>
</div>

<div class="qa-modal" id="qa-modal" aria-hidden="true">
  <div class="qa-sheet" role="dialog" aria-modal="true" aria-labelledby="qa-title">
    <button class="qa-close" id="qa-close">Close</button>
    <h2 id="qa-title">Slide Questions & Answers</h2>
    <div id="qa-content"></div>
  </div>
</div>

<script>
const notes = [
  {
    slide: 1,
    title: "Title Slide",
    points: [
      "Introduce yourself: Kian Kamali, ENEB352",
      "Topic: How CDNs Make the Web Fast",
      "18 slides covering protocols, architecture, real systems",
      "Not just caching — it's about rethinking internet routing"
    ]
  },
  {
    slide: 2,
    title: "The Problem: Distance",
    points: [
      "Tokyo to Virginia: 11,000 km of fiber",
      "70ms one-way, 140ms round-trip at 2/3 speed of light",
      "TCP handshake (1 RTT) + TLS (1-2 RTTs) = 300-500ms total",
      "Every 100ms delay reduces conversion by 1%"
    ]
  },
  {
    slide: 3,
    title: "Protocol Stack",
    points: [
      "Layer 3-4: IP Anycast, BGP, TCP BBR, UDP/QUIC",
      "Layer 5-7: DNS, HTTP/1.1, HTTP/2, HTTP/3, TLS 1.3",
      "Protocols work together, not in isolation",
      "Each serves a specific purpose in CDN performance"
    ]
  },
  {
    slide: 4,
    title: "DNS & Anycast Routing",
    points: [
      "DNS doesn't return one IP — uses GeoDNS",
      "Anycast: hundreds of servers share same IP",
      "BGP routes to closest server, auto-failover if PoP dies",
      "Cloudflare: hundreds of cities | Akamai: 4,400+ edge PoPs"
    ]
  },
  {
    slide: 5,
    title: "HTTP Evolution",
    points: [
      "HTTP/1.1 (1997): 6 conn limit, head-of-line blocking",
      "HTTP/2 (2015): Multiplexing but still TCP-blocked",
      "HTTP/3 (RFC 9114): QUIC over UDP, independent streams",
      "HTTP/3 can reduce delay on lossy mobile networks because packet loss does not block every stream the same way"
    ]
  },
  {
    slide: 6,
    title: "TLS 1.3: Zero RTT",
    points: [
      "TLS 1.2: 2 RTT handshake",
      "TLS 1.3: 1 RTT for new, 0 RTT for resumed",
      "Session keys enable instant encryption on repeat visits",
      "Trade-off: First packet lacks forward secrecy"
    ]
  },
  {
    slide: 7,
    title: "Cache Hierarchy",
    points: [
      "Edge cache: Serves 80-95% of requests, minutes TTL",
      "Regional cache: Handles misses, reduces origin load",
      "Origin: Only hit on true misses, protected by shield",
      "Like DNS hierarchy — tiered design absorbs burst"
    ]
  },
  {
    slide: 8,
    title: "Cache Control Headers",
    points: [
      "max-age: How long CDN serves without checking origin",
      "s-maxage: CDN-specific TTL (different from browser)",
      "stale-while-revalidate: Serve stale, fetch fresh in background",
      "Static assets: 1 year | HTML: 5-60 min"
    ]
  },
  {
    slide: 9,
    title: "Cache Invalidation",
    points: [
      "The hardest problem in CS — stale content lingers",
      "Purge API: Invalidate URLs instantly (~30s propagation)",
      "Cache busting: Hash in filenames (app.abc123.js)",
      "Surrogate keys: Tag content, purge thousands at once"
    ]
  },
  {
    slide: 10,
    title: "Cloudflare Case Study",
    points: [
      "Hundreds of cities, 100+ countries, and connections to 13,000+ networks",
      "Workers: V8 isolates at every edge, no cold starts",
      "R2 Storage: S3-compatible, zero egress fees",
      "Mitigated 71M req/s DDoS (Feb 2023)"
    ]
  },
  {
    slide: 11,
    title: "Akamai & Fastly",
    points: [
      "Akamai: 4,400+ edge PoPs, enterprise/media streaming",
      "Fastly: programmable edge control and fast configuration changes",
      "CloudFront: Deep AWS integration",
      "Each serves different use cases — no one-size-fits-all"
    ]
  },
  {
    slide: 12,
    title: "Trade-offs: Latency vs Cost",
    points: [
      "Latency: 200ms → 20ms (10x improvement)",
      "Cost: Origin drops 80-95%, but CDN egress fees apply",
      "Complexity: Cache invalidation, SSL mgmt, vendor APIs",
      "Energy: Edge servers consume MWs, but reduce transmission"
    ]
  },
  {
    slide: 13,
    title: "More Trade-offs",
    points: [
      "Thundering herd: Cache expiry = thousands hit origin",
      "SSL termination at edge vs end-to-end encryption",
      "Vendor lock-in: Edge compute is proprietary",
      "Fundamental tension: caching increases staleness"
    ]
  },
  {
    slide: 14,
    title: "Improvement: Edge Compute",
    points: [
      "Run logic at edge instead of routing to origin",
      "Cloudflare Workers (V8), Fastly Compute (WASM)",
      "A/B testing, personalization at 5ms from user",
      "Edge-First: User → Worker → KV → User (5-20ms)"
    ]
  },
  {
    slide: 15,
    title: "Improvement: HTTP/3 Adoption",
    points: [
      "35% of web on HTTP/3 (2026)",
      "Holdouts: Enterprise firewalls blocking UDP",
      "3% packet loss: HTTP/3 loads 2x faster than HTTP/2",
      "Recommendation: Enable immediately — gains are free"
    ]
  },
  {
    slide: 16,
    title: "Improvement: Smarter Caching",
    points: [
      "ML prefetch: Predict next request, preload to edge",
      "Tiered TTL: Hot = short, Cold = long, dynamic",
      "Real-time purge: WebSocket invalidation",
      "Next frontier: Intelligent content distribution"
    ]
  },
  {
    slide: 17,
    title: "References",
    points: [
      "11 APA references including RFCs and textbooks",
      "Key sources: Cloudflare, IETF RFCs, Kurose & Ross",
      "RFC 9000 (QUIC), RFC 9114 (HTTP/3), RFC 8446 (TLS 1.3)",
      "All sources verified and current as of Spring 2026"
    ]
  },
  {
    slide: 18,
    title: "Q&A",
    points: [
      "Thank the audience for attention",
      "Open floor for questions",
      "Contact: kkamali@terpmail.umd.edu",
      "GitHub: github.com/kkamali04"
    ]
  }
];

const qaBank = [
  { slide: 1, q: 'What is a CDN?', a: 'A CDN is a network of edge servers that deliver content from locations closer to users.' },
  { slide: 2, q: 'Why does distance matter so much?', a: 'Every extra round trip adds delay before the page can even start loading.' },
  { slide: 3, q: 'Why do protocols matter if caching already helps?', a: 'CDNs improve routing, transport, encryption, and delivery together.' },
  { slide: 4, q: 'How does Anycast pick the nearest server?', a: 'Multiple PoPs share one IP, and BGP routes traffic to the closest healthy path.' },
  { slide: 5, q: 'Why is HTTP/3 better on bad networks?', a: 'QUIC keeps streams independent, so packet loss does not stall everything.' },
  { slide: 6, q: 'What does TLS 1.3 save?', a: 'It reduces handshake round trips and makes repeat visits faster.' },
  { slide: 7, q: 'Why use edge, regional, and origin layers?', a: 'The layers absorb traffic step by step so the origin stays protected.' },
  { slide: 8, q: 'Why not cache everything forever?', a: 'Content changes, so cache headers control freshness and user experience.' },
  { slide: 9, q: 'Why is invalidation hard?', a: 'Because one change can affect many cached copies across many PoPs.' },
  { slide: 10, q: 'What makes Cloudflare a good case study?', a: 'It combines CDN delivery, edge compute, storage, and security at scale.' },
  { slide: 11, q: 'Why compare Akamai, Fastly, and CloudFront?', a: 'Each provider emphasizes different strengths, so there is no one best CDN.' },
  { slide: 12, q: 'What is the biggest trade-off with CDNs?', a: 'You trade lower latency for added cost and more operational complexity.' },
  { slide: 13, q: 'What is the main risk of edge caching and edge compute?', a: 'Staleness, security trust, and vendor lock-in all increase with distribution.' },
  { slide: 14, q: 'Why move logic to the edge?', a: 'So simple dynamic tasks happen near users instead of going back to origin.' },
  { slide: 15, q: 'Should everyone enable HTTP/3?', a: 'Yes, if the CDN and client support it, because the gain is usually easy to get.' },
  { slide: 16, q: 'What does smarter caching mean?', a: 'Predicting demand, tuning TTLs, and invalidating in real time instead of waiting.' },
  { slide: 17, q: 'Why is the reference slide important?', a: 'It shows the talk is grounded in standards and current sources.' },
  { slide: 18, q: 'What is the one sentence takeaway?', a: 'CDNs make the web fast by shortening distance, reducing round trips, and moving work closer to users.' },
  { slide: 'Final', q: 'What is a CDN in plain English?', a: 'A distributed set of servers that gets content closer to the user.' },
  { slide: 'Final', q: 'Why not just use one bigger server?', a: 'Because physical distance and regional congestion still create delay.' },
  { slide: 'Final', q: 'What is Anycast?', a: 'Many servers advertise the same IP address, and routing sends users to the nearest healthy one.' },
  { slide: 'Final', q: 'What problem does HTTP/3 solve?', a: 'It reduces head-of-line blocking by using QUIC over UDP with independent streams.' },
  { slide: 'Final', q: 'What is the hardest CDN problem?', a: 'Cache invalidation.' },
  { slide: 'Final', q: 'Why are edge compute platforms important?', a: 'They let you run logic near users instead of sending every request back to origin.' }
];

function renderQA() {
  const content = document.getElementById('qa-content');
  content.innerHTML = qaBank.map(item => `
    <div class="qa-group">
      <div class="qa-q">Slide ${item.slide}: ${item.q}</div>
      <div class="qa-a">${item.a}</div>
    </div>
  `).join('');
}

function openQA() {
  const modal = document.getElementById('qa-modal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
}

function closeQA() {
  const modal = document.getElementById('qa-modal');
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
}

let currentSlide = 0;
const startTime = Date.now();

function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
}

function updateTimer() {
  const elapsed = Date.now() - startTime;
  document.getElementById('timer').textContent = formatTime(elapsed);
}

function render() {
  const note = notes[currentSlide];
  document.getElementById('slide-info').textContent = `Slide ${note.slide} / 18`;
  
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="slide-title">${note.title}</div>
    <div class="section">
      <div class="section-label">Key Talking Points</div>
      <ul class="talking-points">
        ${note.points.map(p => `<li>${p}</li>`).join('')}
      </ul>
    </div>
  `;
  content.scrollTop = 0;
  
  // Update dots
  const dotsContainer = document.getElementById('progress-dots');
  dotsContainer.innerHTML = notes.map((_, i) => 
    `<div class="dot ${i === currentSlide ? 'active' : ''}"></div>`
  ).join('');
}

function next() {
  if (currentSlide < notes.length - 1) {
    currentSlide++;
    render();
  }
}

function prev() {
  if (currentSlide > 0) {
    currentSlide--;
    render();
  }
}

document.getElementById('next-btn').addEventListener('click', next);
document.getElementById('prev-btn').addEventListener('click', prev);
document.getElementById('qa-btn').addEventListener('click', () => { renderQA(); openQA(); });
document.getElementById('qa-close').addEventListener('click', closeQA);
document.getElementById('qa-modal').addEventListener('click', (e) => { if (e.target.id === 'qa-modal') closeQA(); });

// Swipe support
let touchStartX = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    if (dx < 0) next();
    else prev();
  }
});

// Keyboard support
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') next();
  if (e.key === 'ArrowLeft') prev();
});

setInterval(updateTimer, 1000);
render();
</script>
</body>
</html>
